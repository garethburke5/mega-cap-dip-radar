name: Add DKS to Share Sniper

on:
  push:
    paths:
      - '.github/workflows/add-dks-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.py
        shell: python
        run: |
          from pathlib import Path

          p = Path('app.py')
          s = p.read_text()

          replacements = [
              (
                  'CORE_WATCHLIST = ["TSLA","NVDA","META","AMZN","GOOGL","AVGO","BARC.L","QCOM","BA","SPCX"]',
                  'CORE_WATCHLIST = ["TSLA","NVDA","META","AMZN","GOOGL","AVGO","BARC.L","QCOM","BA","SPCX","DKS"]'
              ),
              (
                  '    "SPCX":"SpaceX",\n',
                  '    "SPCX":"SpaceX",\n    "DKS":"DICK\'S Sporting Goods",\n'
              ),
              (
                  '    "SPCX":"Full Sniper analysis + new-listing intelligence — potentially exceptional rebound amplitude. Use the same price, RSI, dip, entry, market, news and fundamental analysis as every other share, plus extra IPO/unlock/event context because the trading history is short.",\n',
                  '    "SPCX":"Full Sniper analysis + new-listing intelligence — potentially exceptional rebound amplitude. Use the same price, RSI, dip, entry, market, news and fundamental analysis as every other share, plus extra IPO/unlock/event context because the trading history is short.",\n    "DKS":"Special-event rebound candidate after the Foot Locker-driven sell-off. Do not chase the bounce: only actionable at $125 or below, and check that the post-crash floor/fundamentals are holding before buying.",\n'
              ),
              (
                  '    "SPCX": (110.0, 120.0),\n',
                  '    "SPCX": (110.0, 120.0),\n    "DKS": (120.0, 125.0),\n'
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected text not found; refusing partial patch: {old[:100]}')
              s = s.replace(old, new, 1)

          p.write_text(s)

          # Guardrails: DKS must be in the core universe and have a hard $125 ceiling.
          out = p.read_text()
          assert '"DKS"' in out
          assert '"DKS": (120.0, 125.0)' in out
          assert 'only actionable at $125 or below' in out
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Commit DKS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Add DKS with $125 max Sniper entry"
          git push
