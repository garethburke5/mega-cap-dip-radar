name: Auction History Free Runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auction-history-free-runner.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction-history-free-runner
  cancel-in-progress: false

jobs:
  run-isolated-auction-history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated auction-history runner branch
        uses: actions/checkout@v4
        with:
          ref: auction-history-runner
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight crawler dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh Allsop historical auction discovery
        run: python auction_history_runner/discover_allsop.py

      - name: Backfill next ten Allsop historical auctions from JSON API
        run: python -c "from auction_history_runner.backfill_allsop_api import main; main(10)"

      - name: Publish history records and telemetry to isolated branch
        if: always()
        run: |
          git config user.name 'Auction History Free Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add auction_history_output/allsop_discovery.json auction_history_output/progress.json auction_history_output/allsop_lots.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill Allsop historical lots via public API'
            git push origin HEAD:auction-history-runner
          fi
