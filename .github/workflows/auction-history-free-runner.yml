name: Auction History Free Runner

on:
  push:
    branches:
      - auction-history-runner
    paths:
      - 'auction_history_runner/**'
      - '.github/workflows/auction-history-free-runner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-allsop-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          ref: auction-history-runner
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crawler dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install chromium

      - name: Discover Allsop historical commercial auctions
        run: python auction_history_runner/discover_allsop.py

      - name: Publish discovery and telemetry
        if: always()
        run: |
          git config user.name 'Auction History Free Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add auction_history_output/allsop_discovery.json auction_history_output/progress.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Write Allsop historical discovery telemetry'
            git push origin auction-history-runner
          fi
