name: Auction History Free Runner

# runner revision: strettons-browser-fallback-v4
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auction-history-free-runner.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: auction-history-free-runner
  cancel-in-progress: false

jobs:
  run-isolated-auction-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated auction-history runner branch
        uses: actions/checkout@v4
        with:
          ref: auction-history-runner
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crawler dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Keep Allsop caught up
        run: python -c "from auction_history_runner.backfill_allsop_api import main; main(20)"

      - name: Keep Savills caught up
        run: python -c "from auction_history_runner.backfill_savills import main; main(28)"

      - name: Repair legacy Savills archive formats conservatively
        run: python -c "from auction_history_runner.backfill_savills_legacy import main; main(20)"

      - name: Backfill Strettons historical auctions
        run: python -c "from auction_history_runner.backfill_strettons_bootstrap import main; main(8)"

      - name: Export canonical multi-source History V2 records and index
        run: python auction_history_runner/export_history_v2.py

      - name: Publish history records and telemetry to isolated branch
        if: always()
        run: |
          git config user.name 'Auction History Free Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add auction_history_output/progress.json \
                  auction_history_output/allsop_lots.json \
                  auction_history_output/savills_lots.json \
                  auction_history_output/strettons_lots.json \
                  auction_history_output/history_v2/allsop_events.json \
                  auction_history_output/history_v2/allsop_index.json \
                  auction_history_output/history_v2/history_events.json \
                  auction_history_output/history_v2/history_index.json \
                  auction_history_output/history_v2/summary.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Publish autonomous multi-source auction history checkpoint'
            git push origin HEAD:auction-history-runner
          fi
